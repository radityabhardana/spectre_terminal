name: Spectre Terminal quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: HTMLHint
        run: npx htmlhint public/index.html
      - name: Secret scan
        run: node scripts/scan_secrets.js
      - name: Dependency audit
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=moderate
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit reported a moderate-or-higher advisory or the audit service was unavailable; review the command output. The job remains report-only so an advisory without a remediation does not make CI permanently red."
          fi
          exit 0

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.10.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: timeout 8m npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
